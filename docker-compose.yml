services:
  app:
    build: .
    network_mode: host
    #ports:
    #  - "8000:8000"
    environment:
      - S3_CACHE_ENABLED=true
      - S3_CACHE_BUCKET=label-tool-cache
      - S3_CACHE_PREFIX=datasets-cache
      - S3_ENDPOINT_URL=http://localhost:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MAX_CACHED_DATASETS=1
      - DISK_USAGE_THRESHOLD=0.1
      - DOCS_DIST=/app/docs/dist
      # Empty = SQLite (default). For the pg profile use:
      #   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/fyndnot docker compose --profile pg up
      - DATABASE_URL=${DATABASE_URL:-}
      # Keycloak SSO (MinIO-style OpenID Connect). Disabled by default.
      - SSO_ENABLED=${SSO_ENABLED:-false}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://localhost:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-fyndnot}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-fyndnot-app}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-fyndnot-secret}
      - SSO_REDIRECT_URI=${SSO_REDIRECT_URI:-http://localhost:8000/api/v1/sso}
    volumes:
      - ./data:/app/data
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    profiles: ["sso"]
    network_mode: host
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    command: start-dev --import-realm
    restart: unless-stopped
    volumes:
      - ./data/fyndnot-realm.json:/opt/keycloak/data/import/fyndnot-realm.json

  pg:
    image: postgres:16-alpine
    profiles: ["pg"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fyndnot
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    network_mode: host
    #ports:
    #  - "9000:9000"
    #  - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    network_mode: host
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://localhost:9000 minioadmin minioadmin) do
        echo 'Waiting for minio...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/label-tool-cache --ignore-existing;
      echo 'Bucket created';
      exit 0;
      "
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio-data:
  pg-data:
