services:
  app:
    build: .
    network_mode: host
    #ports:
    #  - "8000:8000"
    environment:
      - S3_CACHE_ENABLED=true
      - S3_CACHE_BUCKET=label-tool-cache
      - S3_CACHE_PREFIX=datasets-cache
      - S3_ENDPOINT_URL=http://localhost:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MAX_CACHED_DATASETS=1
      - DISK_USAGE_THRESHOLD=0.1
      # Upload budget. Each in-flight upload costs a spooled copy on disk plus a
      # pyarrow conversion in RAM (measured: a 1.1 GB CSV adds ~280 MB on top of
      # a ~175 MB baseline, so a conversion is bounded by the file size, not the
      # whole payload). Size the two together:
      #   mem_limit >= ~350 MB + MAX_CONCURRENT_UPLOADS x 0.5 x MAX_UPLOAD_BYTES
      # With the defaults below (2 GiB x 2) that is ~2.5 GiB, so FYNDNOTE_MEM_LIMIT
      # defaults to 3g. Raise MAX_CONCURRENT_UPLOADS only with a matching limit,
      # otherwise the OOM killer takes down the whole container mid-upload.
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-2147483648}
      - MAX_CONCURRENT_UPLOADS=${MAX_CONCURRENT_UPLOADS:-2}
      - MAX_UPLOAD_WAIT_SECONDS=${MAX_UPLOAD_WAIT_SECONDS:-900}
      # Empty = SQLite (default). For the pg profile use:
      - DATABASE_URL=postgresql://postgres:postgres@localhost:5432/fyndnote
      #- DATABASE_URL=${DATABASE_URL:-}
      # Keycloak SSO (MinIO-style OpenID Connect). Disabled by default.
      - SSO_ENABLED=${SSO_ENABLED:-false}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://localhost:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-fyndnote}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-fyndnote-app}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-fyndnote-secret}
      - SSO_REDIRECT_URI=${SSO_REDIRECT_URI:-http://localhost:8000/api/v1/sso}
    volumes:
      - ./data:/app/data
    # Hard ceiling so an oversized import cannot take down the host: the OOM
    # killer reaps this container (restart: unless-stopped brings it back) instead
    # of the whole machine. Kept coherent with MAX_UPLOAD_BYTES x
    # MAX_CONCURRENT_UPLOADS by the sizing rule above, and cross-checked at boot
    # by check_memory_budget(), which logs a warning when they disagree.
    mem_limit: ${FYNDNOTE_MEM_LIMIT:-3g}
    # Equal to mem_limit means no swap, which is what makes the cap a real
    # ceiling: Docker otherwise defaults total mem+swap to 2x mem_limit, so
    # pyarrow would quietly spill to disk and the container would sail past 3g.
    # Raise this alone if you would rather survive a conversion spike by spilling
    # (slow) than by being killed.
    memswap_limit: ${FYNDNOTE_MEMSWAP_LIMIT:-${FYNDNOTE_MEM_LIMIT:-3g}}
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    profiles: ["sso"]
    network_mode: host
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    command: start-dev --import-realm
    restart: unless-stopped
    volumes:
      - ./data/fyndnote-realm.json:/opt/keycloak/data/import/fyndnote-realm.json

  pg:
    image: postgres:16-alpine
    profiles: ["pg"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fyndnote
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    network_mode: host
    #ports:
    #  - "9000:9000"
    #  - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    network_mode: host
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://localhost:9000 minioadmin minioadmin) do
        echo 'Waiting for minio...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/label-tool-cache --ignore-existing;
      echo 'Bucket created';
      exit 0;
      "
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio-data:
  pg-data:
